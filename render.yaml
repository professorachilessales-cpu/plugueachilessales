services:
  - type: web
    name: plugue-escola
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        value: libsql://plugueachiles-achilessales.aws-us-west-2.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
